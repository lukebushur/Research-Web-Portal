AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Stack for Research Web Portal dev environment

#Parameters:
#    ContainerFrontendPort:
#        Description:

Mappings:
#    IAM-Map:
#        IAM-Role-Names:
#            ECR-Access: !Sub "ECR_Access_Role-${AWS::StackName}-${AWS::Region}"
    taggingMap:
        stackType:
            key: stack
            dev: dev
            prod: prod



Resources:
    ECRAccessRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service:
                              - codebuild.amazonaws.com
                              - codepipeline.amazonaws.com
                      Action:
                          - 'sts:AssumeRole'
            Description: Allows services to call ECR.
#            ManagedPolicyArns:
#                - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicPowerUser
#            MaxSessionDuration: 36000
            Path: /
#            PermissionsBoundary:
            Policies:
                - PolicyName: root
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                        - Sid: AllowAll
                          Effect: Allow
                          Action:
                              - "ecr:*"
                          Resource:
                              - "*"
                          Condition:
                            StringEquals:
                                "aws:ResourceTag/stack": "dev"
            RoleName: !Sub "ECR_Access_Role-${AWS::StackName}-${AWS::Region}" # Keep StackeName and Region in avoid IAM errors due to multiple roles with the same name
            Tags:
                - Key: !FindInMap [taggingMap, stackType, key]
                  Value: !FindInMap [taggingMap, stackType, dev]

    DevVPC:
        Type: AWS::EC2::VPC
        Properties:
            CidrBlock: 10.0.0.0/22
            EnableDnsSupport: true
            EnableDnsHostnames: true
            Tags:
                - Key: !FindInMap [taggingMap, stackType, key]
                  Value: !FindInMap [taggingMap, stackType, dev]

    DevRepoECR:
        Type: AWS::ECR::Repository
        Properties:
            EmptyOnDelete: false
#            EncryptionConfiguration:
#                EncryptionType: KMS
#            ImageScanningConfiguration:
#                ScanOnPush: false
            ImageTagMutability: MUTABLE
#            LifecyclePolicy: ReplaceMe if needed: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-ecr-repository-lifecyclepolicy.html
            RepositoryName: dev-repo
            RepositoryPolicyText:
                Version: "2012-10-17"
                Statement:
                    - Sid: AllowPushPull
                      Effect: Allow
                      Principal:
                        AWS:
                            - !GetAtt ECRAccessRole.Arn
                      Action:
                        - "ecr:GetDownloadUrlForLayer"
                        - "ecr:BatchGetImage"
                        - "ecr:BatchCheckLayerAvailability"
                        - "ecr:PutImage"
                        - "ecr:InitiateLayerUpload"
                        - "ecr:UploadLayerPart"
                        - "ecr:CompleteLayerUpload"
            Tags:
                - Key: !FindInMap [taggingMap, stackType, key]
                  Value: !FindInMap [taggingMap, stackType, dev]
