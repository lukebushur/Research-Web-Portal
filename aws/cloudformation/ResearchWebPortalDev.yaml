AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Stack for Research Web Portal dev environment


Mappings:
  #    IAM-Map:
  #        IAM-Role-Names:
  #            ECR-Access: !Sub "ECR_Access_Role-${AWS::StackName}-${AWS::Region}"
  taggingMap:
    stackType:
      key: stack
      dev: dev
      prod: prod
  cidrMap:
    vpcCidrs:
      vpcDev: 10.0.3.0/24
    subnetCidrs:
      subnetDevA: 10.0.3.0/26
      subnetDevB: 10.0.3.64/26

Parameters:
  ArtifactDevBucket:
    Type: String
    Default: rwpp-dev-codepipeline-artifact-bucket
  ActionSourceCICD:
    Type: String
    Default: BingleBangle
  ClientRepoName:
    Type: String
    Default: dev-repo-client
  ServerRepoName:
    Type: String
    Default: dev-repo-server
  SSMorSecretsManagerARN:
    Type: String
    Default: uncreated

Resources:
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
                - ecs.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: ECS task role.
      #            ManagedPolicyArns:
      #                - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicPowerUser
      #            MaxSessionDuration: 36000
      Path: /
      #            PermissionsBoundary:
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowAll
                Effect: Allow
                Action:
                  - "ecr:GetDownloadUrlForLayer"
                Resource:
                  - "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/stack": "dev"
      RoleName: !Sub "ECS_Task_Role-${AWS::StackName}-${AWS::Region}" # Keep Stack Name and Region in avoid IAM errors due to multiple roles with the same name
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs.amazonaws.com
                - ecs-tasks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: ECS execution role.
      #            ManagedPolicyArns:
      #                - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicPowerUser
      #            MaxSessionDuration: 36000
      Path: /
      #            PermissionsBoundary:
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowAll
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                Resource:
                  - "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/stack": "dev"
      RoleName: !Sub "ECS_Execution_Role-${AWS::StackName}-${AWS::Region}" # Keep Stack Name and Region in avoid IAM errors due to multiple roles with the same name
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  CodePipelineDevServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: Allows services to call ECR.
      #        ManagedPolicyArns:
      #          - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicPowerUser
      #            MaxSessionDuration: 36000
      Path: /
      #        PermissionsBoundary:
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Access # No tag conditions because s3 objects don't inherit tags, and it condition applies to them!
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${ArtifactDevBucket}"
                  - !Sub "arn:aws:s3:::${ArtifactDevBucket}/*"
              - Sid: CodeStarCodeBuildAccess
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codestar-connections:GetConnection
                  - codestar-connections:GetHost
                  - codestar-connections:GetInstallationUrl
                  - codestar-connections:ListConnections
                  - codestar-connections:ListHosts
                  - codestar-connections:PassConnection
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  - !Ref DevCodeStarConnection
                  - !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/BuildProject-${AWS::StackName}"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/stack": "dev"
      RoleName: !Sub "CodePipeline-Dev-Service-Role-${AWS::StackName}-${AWS::Region}"
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  CodeBuildDevServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: Allows services to call ECR.
      #        ManagedPolicyArns:
      #          - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicPowerUser
      #            MaxSessionDuration: 36000
      Path: /
      #        PermissionsBoundary:
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Access # No tag conditions because s3 objects don't inherit tags, and it condition applies to them!
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${ArtifactDevBucket}"
                  - !Sub "arn:aws:s3:::${ArtifactDevBucket}/*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/BuildProject-${AWS::StackName}"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*:log-stream:*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/stack": "dev"
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource:
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ServerRepoName}"
                  - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ClientRepoName}"
              - Sid: ECRTokenAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource:
                  - "*"
              - Sid: ECSAccess
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:CreateService
                  - ecs:DescribeTaskDefinition
                  - ecs:TagResource
                Resource:
                  - "*"
              - Sid: IAMAccess
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt EcsTaskRole.Arn
                  - !GetAtt EcsExecutionRole.Arn
      RoleName: !Sub "CodeBuild-Dev-Service-Role-${AWS::StackName}-${AWS::Region}"
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevCodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/BuildProject-${AWS::StackName}"
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevEcsFrontendSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http from client to ECS containers and egress to VPC
      VpcId: !Ref DevVpc
      GroupName: !Sub 'ecs-frontend-sg-${AWS::StackName}'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !FindInMap [ cidrMap, vpcCidrs, vpcDev ]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevEcsBackendSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http from frontend-sg and egress to external db
      VpcId: !Ref DevVpc
      GroupName: !Sub 'ecs-backend-sg-${AWS::StackName}'
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref DevEcsFrontendSg
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [ cidrMap, vpcCidrs, vpcDev ]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      CidrBlock: !FindInMap [ cidrMap, subnetCidrs, subnetDevA ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]
      VpcId: !Ref DevVpc

  DevSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      CidrBlock: !FindInMap [ cidrMap, subnetCidrs, subnetDevB ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]
      VpcId: !Ref DevVpc

  DevInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DevVpc
      InternetGatewayId: !Ref DevInternetGateway

  DevPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevVpc
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: DevVPCGatewayAttachment
    Properties:
      RouteTableId: !Ref DevPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DevInternetGateway

  DevSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevSubnetA
      RouteTableId: !Ref DevPublicRouteTable

  DevSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DevSubnetB
      RouteTableId: !Ref DevPublicRouteTable

  DevRepoServer:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      #            EncryptionConfiguration:
      #                EncryptionType: KMS
      #            ImageScanningConfiguration:
      #                ScanOnPush: false
      ImageTagMutability: MUTABLE
      #            LifecyclePolicy: ReplaceMe if needed: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-ecr-repository-lifecyclepolicy.html
      RepositoryName: !Sub "${ServerRepoName}"
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPushPull
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:GetAuthorizationToken
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevRepoClient:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: false
      #            EncryptionConfiguration:
      #                EncryptionType: KMS
      #            ImageScanningConfiguration:
      #                ScanOnPush: false
      ImageTagMutability: MUTABLE
      #            LifecyclePolicy: ReplaceMe if needed: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-ecr-repository-lifecyclepolicy.html
      RepositoryName: !Sub "${ClientRepoName}"
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPushPull
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Action:
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:GetAuthorizationToken
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: DevCluster
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "BuildProject-${AWS::StackName}"
      ServiceRole: !GetAtt CodeBuildDevServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:6.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ECR_REPO_SERVER_URI
            Value: !GetAtt DevRepoServer.RepositoryUri
          - Name: AWS_ECR_REPO_CLIENT_URI
            Value: !GetAtt DevRepoClient.RepositoryUri
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_TASK_ROLE
            Value: !Ref EcsTaskRole
          - Name: AWS_EXECUTION_ROLE
            Value: !Ref EcsExecutionRole
          - Name: ECS_CLUSTER_NAME
            Value: !Ref DevECSCluster
          - Name: SUBNET_A
            Value: !Ref DevSubnetA
          - Name: SUBNET_B
            Value: !Ref DevSubnetB
          - Name: BACKEND_SG
            Value: !Ref DevEcsBackendSg
          - Name: FRONTEND_SG
            Value: !Ref DevEcsFrontendSg
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref DevCodeBuildLogGroup
      Source:
        Type: CODEPIPELINE
        BuildSpec: aws/dev/buildspec.yaml
      TimeoutInMinutes: 15
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]

  DevCodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      ArtifactStore:
        Type: S3
        Location: !Ref DevArtifactS3Bucket
      Name: !Sub "Pipeline_-${AWS::StackName}-${AWS::Region}"
      PipelineType: V2
      RestartExecutionOnUpdate: false
      RoleArn: !GetAtt CodePipelineDevServiceRole.Arn
      Stages:
        - Name: Source
          Actions:
            - Name: !Sub "${ActionSourceCICD}"
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeStarSourceConnection
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                ConnectionArn: !Ref DevCodeStarConnection
                FullRepositoryId: "lukebushur/Research-Web-Portal"
                BranchName: "dev-deployment"
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Ref DevCodeBuildProject
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]
      Triggers:
        - ProviderType: CodeStarSourceConnection
#          TriggerName: CodeStarSourceConnection
#          TriggerTargetArn: !Ref DevCodeStarConnection
#          TriggerType: Webhook
          GitConfiguration:
            Push:
              #                - Tags:
              #                    Excludes:
              #                      - beta-*
              #                    Includes:
              #                      - release-*
              - Branches:
                  Includes:
                    - dev-deployment
                FilePaths:
                  Includes:
                    - aws/**
                    - client/**
                    - server/**
                    - docker-compose.yml
                    - nginx.conf
            #                    Excludes:
            #                      - '**/README.md'
            PullRequest:
              - Branches:
                  Includes:
                    - dev-deployment
                FilePaths:
                  Includes:
                    - aws/**
                    - client/**
                    - server/**
                    - docker-compose.yml
                    - nginx.conf
                  Excludes:
                    - '**/README.md'
                Events:
                  - CLOSED
            SourceActionName: !Sub "${ActionSourceCICD}"

  DevArtifactS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
            BucketKeyEnabled: true
      BucketName: !Sub "${ArtifactDevBucket}"
      #        LoggingConfiguration:
      #          LoggingConfiguration
      #        MetadataConfiguration:
      #          MetadataConfiguration
      #        MetricsConfigurations:
      #          - MetricsConfiguration
      #        NotificationConfiguration:
      #          NotificationConfiguration
      #        OwnershipControls:
      #          OwnershipControls
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      #        ReplicationConfiguration:
      #          ReplicationConfiguration
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]
  #        VersioningConfiguration:
  #          VersioningConfiguration

  DevArtifactS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DevArtifactS3Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetBucketVersioning
              - s3:PutObject
            Effect: Allow
            Resource:
              - !Sub "arn:aws:s3:::${ArtifactDevBucket}"
              - !Sub "arn:aws:s3:::${ArtifactDevBucket}/*"
            Principal:
              AWS: !GetAtt CodePipelineDevServiceRole.Arn

  DevCodeStarConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: "GithubConnection"
      ProviderType: GitHub
      Tags:
        - Key: !FindInMap [ taggingMap, stackType, key ]
          Value: !FindInMap [ taggingMap, stackType, dev ]