version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=$(date +%Y%m%d%H%M%S)

  build:
    commands:
      - echo Building server image...
      - docker build -t $AWS_ECR_REPO_SERVER_URI:$IMAGE_TAG -f server/Dockerfile ./server
      - docker tag $AWS_ECR_REPO_SERVER_URI:$IMAGE_TAG $AWS_ECR_REPO_SERVER_URI:latest

      - echo Building client image...
      - docker build -t $AWS_ECR_REPO_CLIENT_URI:$IMAGE_TAG -f client/Dockerfile ./client
      - docker tag $AWS_ECR_REPO_CLIENT_URI:$IMAGE_TAG $AWS_ECR_REPO_CLIENT_URI:latest

  post_build:
    commands:
      - echo Pushing images to ECR...
      - docker push $AWS_ECR_REPO_SERVER_URI:$IMAGE_TAG
      - docker push $AWS_ECR_REPO_SERVER_URI:latest
      - docker push $AWS_ECR_REPO_CLIENT_URI:$IMAGE_TAG
      - docker push $AWS_ECR_REPO_CLIENT_URI:latest

      # Create or update ECS task definitions using templates (<CLIENT OR SERVER>-task-definition-template.json)
      - echo Creating or updating the ECS task definition...
      - |
        sed -e "s|<SERVER_IMAGE_TAG>|$AWS_ECR_REPO_SERVER_URI:$IMAGE_TAG|g" \
            -e "s|<REGION>|$AWS_REGION|g" \
            -e "s|<ACCOUNT_ID>|$AWS_ACCOUNT_ID|g" \
            -e "s|<TASK_ROLE>|$AWS_TASK_ROLE|g" \
            -e "s|<EXECUTION_ROLE>|$AWS_EXECUTION_ROLE|g" \
            -e "s|<SECRET_ENV_PATH>|$SECRET_ENV_PATH|g" \
            aws/dev/backend-dev-task-definition-template.json > aws/dev/backend-dev-final-task-definition.json
      - |
        sed -e "s|<CLIENT_IMAGE_TAG>|$AWS_ECR_REPO_CLIENT_URI:$IMAGE_TAG|g" \
            -e "s|<REGION>|$AWS_REGION|g" \
            -e "s|<ACCOUNT_ID>|$AWS_ACCOUNT_ID|g" \
            -e "s|<EXECUTION_ROLE>|$AWS_EXECUTION_ROLE|g" \
            -e "s|<SECRET_ENV_PATH>|$SECRET_ENV_PATH|g" \
            aws/dev/frontend-dev-task-definition-template.json > aws/dev/frontend-dev-final-task-definition.json

      # Register the updated task definitions with ECS
      - echo $server-task-name
      - aws ecs register-task-definition --family $server-task-name --cli-input-json file://aws/dev/backend-dev-final-task-definition.json
      - aws ecs register-task-definition --family $client-task-name --cli-input-json file://aws/dev/frontend-dev-final-task-definition.json

      # Create back-end service if it does not exist. If it does, update it
      - echo Checking if ECS Back End service exists...
      - if aws ecs describe-services --cluster $ECS_CLUSTER_NAME --services $ecs_backend_service_name --query "services[0].status" --output text | grep -q ACTIVE; then
          echo "Service exists. Updating service...";
          backend_new_task_revision=$(aws ecs describe-task-definition --task-definition "$server-task-name" --query "taskDefinition.revision" --output text);
          aws ecs update-service --cluster $ECS_CLUSTER_NAME --service $ecs_backend_service_name --task-definition $server-task-name:$backend_new_task_revision;
        else
          echo "Service does not exist. Creating new service...";
          aws ecs create-service --cluster $ECS_CLUSTER_NAME --service-name $ecs_backend_service_name --task-definition $server-task-name --desired-count 1 --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_A,$SUBNET_B],securityGroups=[$BACKEND_SG],assignPublicIp=ENABLED}";
        fi

      # Create front-end service if it does not exist. If it does, update it
      - echo Checking if ECS Front End service exists...
      - if aws ecs describe-services --cluster $ECS_CLUSTER_NAME --services $ecs_frontend_service_name --query "services[0].status" --output text | grep -q ACTIVE; then
          echo "Service exists. Updating service...";
          frontend_new_task_revision=$(aws ecs describe-task-definition --task-definition "$client-task-name" --query "taskDefinition.revision" --output text);
          aws ecs update-service --cluster $ECS_CLUSTER_NAME --service $ecs_frontend_service_name --task-definition $client-task-name:$frontend_new_task_revision;
        else
          echo "Service does not exist. Creating new service...";
          aws ecs create-service --cluster $ECS_CLUSTER_NAME --service-name $ecs_frontend_service_name --task-definition $client-task-name --desired-count 1 --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_A,$SUBNET_B],securityGroups=[$FRONTEND_SG],assignPublicIp=ENABLED}";
        fi

artifacts:
  files:
    - aws/dev/backend-dev-task-definition-template.json
    - aws/dev/backend-dev-final-task-definition.json
    - aws/dev/frontend-dev-task-definition-template.json
    - aws/dev/frontend-dev-final-task-definition.json
